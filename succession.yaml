    effective_date: "2025-05-15"
    instrument_id: "gbga-2024"
    instrument_title: "The Greater Bengaluru Governance Act, 2024 (Karnataka Act No. 36 of 2025), Sections 2(11), 2(16), 10(3), 25 & 230(1) (pp. 163, 170, 177, 247)"
    quoted_evidence: "(11) “Chief Commissioner” means the Chief Commissioner of the Greater Bengaluru Authority appointed under section 10; ... (16) “Commissioner” means the Commissioner of a City Corporation appointed under this Act; ... 10. (3) The Chief Commissioner shall be the Principal Executive Officer of the Greater Bengaluru Authority ... 25. The Authorities of the City Corporation.- The following shall be the Authorities of the City Corporation who shall carry out the provisions of the Act, namely:- (a) The Mayor; (b) The Commissioner; (c) The Joint Commissioners; ... 230. Procedure for grant of sanction to building plan.– (1) Any person intending to construct or reconstruct a building, shall by way of an application, as specified in building bye-laws shall apply to the Commissioner for permission to execute the work."
    source_url: "https://updates.bbmp.gov.in/v1/api/file/120330573287-THE%20GREATER%20BENGALURU%20GOVERNANCE%20ACT,%202024%20Gazzet%20copy%20GBGA.pdf"

