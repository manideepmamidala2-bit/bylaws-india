    effective_date: "2025-05-15"
    instrument_id: "gbga-2024"
    instrument_title: "The Greater Bengaluru Governance Act, 2024 (Karnataka Act No. 36 of 2025), Section 14(2)(a)–(b) (p. 173) & Notification No. UDD 468 MNJ 2025(E) (15-10-2025)"
    quoted_evidence: "14. (2) Planning Functions: Notwithstanding anything contained in any other law for the time being in force,- (a) the Greater Bengaluru Authority shall be the “Planning Authority” as defined under the Karnataka Town and Country Planning Act, 1961, for the areas comprising of the Greater Bengaluru Area; (b) within the physical boundaries of Greater Bengaluru area the approval of any layout including the industrial layout may be done by Greater Bengaluru Authority in conformity with the master plan and to ensure proper circulation of traffic, Plan Sanction of such industrial units shall be done by the respective City Corporation; | Notification No. UDD 468 MNJ 2025(E) (15-10-2025, p. 1): “These may be called the Zonal Regulations of Revised Master Plan-2015 of the Local Planning Area of Bengaluru (BDA) and Local Planning Area of Greater Bengaluru Authority (Amendment) Regulations 2025.”"
    source_url: "https://updates.bbmp.gov.in/v1/api/file/120330573287-THE%20GREATER%20BENGALURU%20GOVERNANCE%20ACT,%202024%20Gazzet%20copy%20GBGA.pdf"
