    instrument_id: "gbga-2024"
    instrument_title: "The Greater Bengaluru Governance Act, 2024 (Karnataka Act No. 36 of 2025), Preamble, Sections 4, 5, 360 & 361 (pp. 161, 167, 291–292)"
    quoted_evidence: "WHEREAS, the Bruhat Bengaluru Mahanagara Palike was established in 2008 and was governed under the provisions of the Karnataka Municipal Corporations Act, 1976 (Karnataka Act 14 of 1977) and later by the provisions of Bruhat Bengaluru Mahanagara Palike Act, 2020 (Karnataka Act 53 of 2020). ... WHEREAS, it is expedient to establish the Greater Bengaluru Authority and introduce new provisions for governing the Corporations and Ward Committees in the Greater Bengaluru Area; ... 4. Civic Authorities in the Greater Bengaluru Area.- The following shall be the Civic Authorities in the Greater Bengaluru Area tasked with the powers to carry out the functions specified under this Act: (a) the Greater Bengaluru Authority; (b) the City Corporations; and (c) the Ward Committees. ... 360. Transitory Provisions.- Any rule, notification, order or appointment, made or issued under the Karnataka Municipal Corporations Act, 1976 (Karnataka Act No. 14 of 1977), the Bruhat Bengaluru Mahanagara Palike Act, 2020 (Karnataka Act No. 53 of 2020) and Rules made thereunder ... shall continue to be in force and effective as if they are made or issued or appointed under the corresponding provisions of this Act ... 361. Repeal and Savings.- (1) The provisions of the Bruhat Bengaluru Mahanagara Palike Act, 2020 (Karnataka Act No. 53 of 2020) and Rules made thereunder are hereby repealed."
    source_url: "https://updates.bbmp.gov.in/v1/api/file/120330573287-THE%20GREATER%20BENGALURU%20GOVERNANCE%20ACT,%202024%20Gazzet%20copy%20GBGA.pdf"

