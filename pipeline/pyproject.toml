[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bylaws"
version = "0.1.0"
description = "Curated, versioned, machine-readable dataset pipeline for building bylaws"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.1.7",
    "pyyaml>=6.0.1",
    "jsonschema>=4.22.0",
    "pydantic>=2.7.0",
    "pypdfium2>=4.30.0",
    "fpdf2>=2.7.9",
    "pillow>=10.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
]

[project.scripts]
bylaws = "bylaws.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bylaws"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
