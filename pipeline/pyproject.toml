[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bylaws"
version = "0.1.0"
description = "Curated, versioned, machine-readable dataset pipeline for building bylaws"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "click>=8.1.7",
    "pyyaml>=6.0.1",
    "jsonschema>=4.22.0",
    "pydantic>=2.7.0",
    "pypdfium2>=4.30.0",
    "pdfplumber>=0.11.4",
    "docling==2.31.0",
    "pytesseract>=0.3.13",
    "httpx>=0.27.0",
    "pillow>=10.3.0",
    "shapely>=2.0.4",
    "pyproj>=3.7.0",
    "geopandas>=1.0.1",
    "rasterio>=1.4.2",
    "opencv-python-headless>=4.10.0.84",
    "scikit-image>=0.24.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
    "fpdf2>=2.7.9",
    "datamodel-code-generator>=0.25.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[project.scripts]
bylaws = "bylaws.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bylaws"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
