[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bylaws"
version = "0.1.0"
description = "Curated, versioned, machine-readable dataset pipeline for building bylaws"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "click>=8.1.7",
    "pyyaml>=6.0.1",
    "jsonschema>=4.22.0",
    "pydantic>=2.7.0",
    "pypdfium2>=4.30.0",
    "pillow>=10.3.0",
    "shapely>=2.0.4",
    "pyproj>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
    "fpdf2>=2.7.9",
    "datamodel-code-generator>=0.25.0",
]

[project.scripts]
bylaws = "bylaws.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bylaws"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
