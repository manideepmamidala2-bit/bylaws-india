    disabled_reason: null
    parameters_governed: null
    authority:
      doc_id: gbga-2024
      eid: chp_XVII__cl_224
      clause_id: "gbga-2024:224"
      page: 245
      quote: "With the approval of the Greater Bengaluru Authority, the City Corporation in its jurisdiction shall make building bye-laws for the regulation and restriction of the use of sites or buildings"
      official_url: "https://dpal.karnataka.gov.in/storage/pdf-files/36%20of%202025%20(E).pdf"
    verification: machine_checked

  - step_number: 3
    step_id: gbga_notwithstanding
    title: "Where the Greater Bengaluru Governance Act 2024 says 'notwithstanding', it prevails"
    plain_rule: "Statutory non-obstante ('notwithstanding') provisions of the Greater Bengaluru Governance Act, 2024 prevail over inconsistent municipal rules."
    enabled: true
    disabled_reason: null
