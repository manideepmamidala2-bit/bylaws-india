    authority:
      doc_id: ka-model-bbl-2017
      eid: chp_1__item_3
      clause_id: "bbl-2003:1.4 (inserted by UDD 14 TTP 2017)"
      page: 2
      quote: "All mandatory Master Plan or Zonal Regulations regarding use, land use, coverage, FAR, setback or open space, height, number of stories, number of dwelling units, parking standards etc. for various categories of buildings including modification therein made from time to time shall be applicable mutatis mutandis in these Bye-Laws under this clause."
