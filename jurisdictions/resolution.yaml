no_limit_in_law_rules:
  - rule_id: r_main_height_above_250m2_and_road_9m
    parameters:
      - building_height_max_m
    zones:
      - R-MAIN
      - R-MIX
    uses: null
    min_plot_area_m2: 250.0
    min_plot_area_inclusive: false
    max_plot_area_m2: null
    max_plot_area_inclusive: true
    min_road_width_m: 9.0
    min_road_width_inclusive: true
    max_road_width_m: null
    max_road_width_inclusive: true
    plain_reason: "Fixed height caps in Residential (Main) apply only where road width is less than 9.0 m under clause 4.1.2(b) or on plots up to 250 m² under Table 8 (12.0 m / 15.0 m with stilt); on plots above 250 m² on roads 9.0 m and wider, building height is governed by FAR and Table 9 setbacks without a separate metre height cap"
    authority:
      doc_id: rmp2015-zr-amend-2026-01
      eid: cl_11
      clause_id: "rmp2015-zr-amend-2026-01:4.1.2(b)"
      page: 5
      quote: "if the road width is less than 9.0 m., then the maximum height is restricted to 15.0m (including stilt floor) irrespective of the FAR permissible"
      official_url: "https://updates.bbmp.gov.in/v1/api/file/948358478137-Setback%20Notification.pdf"

  - rule_id: r_main_no_separate_floor_cap_after_2026
