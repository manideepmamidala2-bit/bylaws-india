      - floors_max
    zones:
      - R-MAIN
      - R-MIX
    uses: null
    min_plot_area_m2: null
    min_plot_area_inclusive: true
    max_plot_area_m2: null
    max_plot_area_inclusive: true
    min_road_width_m: null
    min_road_width_inclusive: true
    max_road_width_m: null
    max_road_width_inclusive: true
    plain_reason: "Clause 4.1.2(b) as amended on 5 January 2026 replaced the 2007 'Stilt + GF + 2 floors' cap with a height restriction on roads under 9.0 m and sets no separate maximum floor count in Residential (Main)"
    authority:
      doc_id: rmp2015-zr-amend-2026-01
      eid: cl_11
      clause_id: "rmp2015-zr-amend-2026-01:4.1.2(b)"
      page: 5
      quote: "if the road width is less than 9.0 m., then the maximum height is restricted to 15.0m (including stilt floor) irrespective of the FAR permissible"
      official_url: "https://updates.bbmp.gov.in/v1/api/file/948358478137-Setback%20Notification.pdf"

