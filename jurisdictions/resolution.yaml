      clause_id: "gbga-2024:223"
      page: 245
      quote: "Notwithstanding anything contained in this Act, a Corporation or any officer or other authority"
      official_url: "https://dpal.karnataka.gov.in/storage/pdf-files/36%20of%202025%20(E).pdf"
    verification: machine_checked

  - step_number: 4
    step_id: zoning_governs_via_byelaw_1_4
    title: "For use, coverage, FAR, setbacks, height, floors, dwelling units and parking, the zoning regulations govern (bye-law 1.4)"
    plain_rule: "Master Plan Zoning Regulations govern use, coverage, FAR, setbacks, height, floors, dwelling units, and parking pursuant to Building Bye-law 1.4 (inserted 2017)."
    enabled: true
    disabled_reason: null
    parameters_governed:
