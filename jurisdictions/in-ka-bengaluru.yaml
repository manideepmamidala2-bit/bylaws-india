not_modelled:
- 'July 2025 zoning amendment (UDD 85 MNJ 2025): the official gazette PDF could not
  be obtained from public sources, so consolidated zoning text and parameter values
  may not reflect changes made in July 2025.'
- 'October 2024 Kannada compilation of RMP 2015 Zoning Regulations: published in Kannada
  only and not structured; this dataset uses the English original together with the
  8 structured English amending notifications.'
- 'Supporting instruments not in the dataset: Karnataka Fire and Emergency Services
  NOC rules, standalone Karnataka Transferable Development Rights (TDR) procedural
  rules, Occupancy Certificate exemption orders, and detailed BMRCL metro transit-oriented
  influence zone rules.'
- 'Land-use zone polygons: available only where RMP 2015 Proposed Land Use map sheets
  have been processed (4 sheets in Planning Districts 2.10 Jayanagar and 2.11 Banashankari
  covering 1,276 zone polygons in Bengaluru South); elsewhere on the map you can select
  a land-use zone manually.'
- National Building Code of India 2016 (copyrighted by BIS; listed as reference only)
  and Airports Authority of India NOCAS colour-coded zoning map (external aviation
  portal; reference only).
