- amending_clause: bscc-bbl-amend-2026-05:part_III__cl_3
  target_clause: bbl-2003:part_II__sec_6.0__item_i
  action: substitute
  effective_date: '2026-05-14'
  confidence: high
  verification: machine_checked
  applies_in:
  - in-ka-bengaluru-south
  replacement_text: '(i) Wherever any construction is in violation/deviation of the
    sanctioned plan, the Commissioner (Bengaluru South City Corporation, Notification
    No: BSCC/Com/PR/35/2026-27 dated 14-05-2026) may, if he considers that the violations
    / deviations are within the limits specified in Table-2B below (up to 15% setback
    and coverage deviation; up to 15% FAR deviation on plots up to 500 sq.m and 5%
    FAR deviation on plots above 500 sq.m; 7.5% height deviation not beyond sanctioned
    number of floors) in case of (1) the setback to be provided around the building,
    (2) plot coverage (3) floor area ratio and (4) height of the building and that
    the demolition under chapter XVII of the Act is not feasible without affecting
    structural stability, he may regularize such violations/deviations after recording
    detailed reasons for the same and levying compounding fee as per Table-2A, Table-2C
    and Table-2D (minimum guidance value consideration Rs.50,000/- per sq.m; Residential
    3%/6% up to 500 sq.m and 5%/10% above 500 sq.m; Non-Residential 6%/12%).'
  note: 'Clause 3 of No: BSCC/Com/PR/35/2026-27 (Bengaluru South City Corporation,
    14-05-2026): substitutes Clause (i) under Bye-law 6.0 (Deviation during construction)
    and inserts Table-2A, Table-2B, Table-2C, and Table-2D for Bengaluru South City
    Corporation.'
