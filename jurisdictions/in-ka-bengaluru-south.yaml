  instrument_type: instrument
  summary_by_site: 2017 state notification (UDD 14 TTP 2017) containing the Model
    Building Bye-laws for Municipal Corporations (Part I, p. 128) and Municipalities
    (Part II, p. 2); Clause 1(3) is the source of Bye-law 1.4.
  applies_to_jurisdiction:
    status: 'no'
    reason: 'This 2017 notification (No. UDD 14 TTP 2017 (P-4), dated 28-10-2017)
      is where the rule that master plan regulations govern setbacks, FAR and coverage
      comes from (Clause 1(3), recorded as Bye-law 1.4 in the 2003 Bye-laws). The
      PDF contains two notifications: Notification-II (pp. 2–127, Gazette No. 992)
      is the Karnataka Municipalities Model Building Bye-Laws 2017 enacted under Section
      325 of the Karnataka Municipalities Act, 1964 (where Act means the Karnataka
      Municipalities Act, 1964, which applies to municipal councils and town panchayats,
      not City Corporations); Notification-I (pp. 128–253, Gazette No. 991) is the
      Karnataka Municipal Corporations Model Building Bye-Laws 2017 enacted under
      Section 508 read with Section 428 of the Karnataka Municipal Corporations Act,
      1976. Whether Notification-I as a whole replaced the 2003 Building Bye-laws
      in Bengaluru is unclear from the 2017 text alone, and the May 2026 City Corporation
      Building (Amendment) Bye-laws expressly amend the Bengaluru City Corporation
      Building Bye-laws, 2003 as the principal in-force code. Accordingly, Clause
      1(3) is recorded as the source of Bye-law 1.4, while the remaining provisions
      of this 2017 model code do not feed plot answers.'
    quoted_evidence: 'Notification-II (p. 2): "in exercise of the powers conferred
      by section 325 of the Karnataka Municipalities Act, 1964 (Karnataka Act 22 of
      1964) ... (1) These bye laws may be called as the Karnataka Municipalities Model
      Building Bye-Laws 2017. ... (2) ‘Act’- means the Karnataka Municipalities Act,
      1964 (Karnataka Act 22 of 1964)" | Notification-I (p. 128): "in exercise of
      the powers conferred by clause (b) of sub-section(1) of section 508 read with
      section 428 of the Karnataka Municipal Corporations Act, 1976 (Karnataka Act
      14 of 1977), the Government of Karnataka hereby makes the following Model Building
      Bye-Laws namely:- ... 1. Title, commencement and application- (1) These Bye
      Laws may be called as the Karnataka Municipal Corporations Model Building Bye-Laws
      2017. (2) They shall come into force from the date of their final publication
      in the official Gazette. (3) All mandatory Master Plan or Zonal Regulations
      regarding use, land use, coverage, FAR, setback or open space, height, number
      of stories, number of dwelling units, parking standards etc. for various categories
      of buildings including modification therein made from time to time shall be
      applicable mutatis mutandis in these Bye-Laws under this clause. All amendments
      or modifications made in the aforesaid regulations shall automatically stand
      deemed to have been included as part of these Bye-laws." | May 2026 City Corporation
      Amendments (p. 2, Clause 2): "In the Bengaluru City Corporation Building Bye-laws-
      2003 (hereinafter referred to as the said bye-laws), Bye-law 3.8- Ground Rent;
      Bye-law 3.9- Ground Rent for high rise buildings and Bye-law 3.10- Exemption
      of ground rent the entire provision shall be omitted."'
    url: https://bpas.bbmpgov.in/BPAMSClient4/Downloads/Bye%20laws%20and%20Zoning%20Regulations/Model%20Building%20Byelaws%20Notification%20No.%20UDD%2014%20TTP%202017%20(P-4)%20Bengaluru,%20Dated%2028-10-2017%20.pdf
  notes_by_site:
  - This 2017 notification (No. UDD 14 TTP 2017 (P-4), dated 28-10-2017) is where
    the rule that master plan regulations govern setbacks, FAR and coverage comes
    from (Clause 1(3) on p. 128 and p. 2, recorded as Bye-law 1.4).
  - Pages 2–127 (Notification-II, Gazette No. 992) are the Karnataka Municipalities
    Model Building Bye-Laws 2017 made under Section 325 of the Karnataka Municipalities
    Act, 1964 (applicable to municipalities, not City Corporations).
  - Pages 128–253 (Notification-I, Gazette No. 991) are the Karnataka Municipal Corporations
    Model Building Bye-Laws 2017 made under Section 508 read with Section 428 of the
    Karnataka Municipal Corporations Act, 1976.
  - Whether Notification-I as a whole replaced the 2003 Bye-laws in Bengaluru is unclear
    from the 2017 text alone; however, the May 2026 City Corporation Building (Amendment)
    Bye-laws expressly amend the 2003 Building Bye-laws, confirming the 2003 Bye-laws
    remained the operative code.
  plain_title: Notification UDD 14 TTP 2017 (Model Building Bye-laws)
