amendment_links:
- amending_clause: rmp2015-zr:chp_3__cl_3.1
  target_clause: bbl-2003:part_III__sec_9.0__cl_9.2
  action: substitute
  effective_date: '2007-06-25'
  confidence: high
  verification: machine_checked
  note: Revised Master Plan 2015 Volume III Zoning Regulations (G.O. No. UDD 540 BEM
    AA SE 2004, effective 25-06-2007) Chapter 3, Regulation 3.1 (Table 8 & Table 9,
    pp. 23–24) supersedes the 1995 CDP exterior setback tables (Tables 4 & 5) in Clause
    9.2 of the 2003 Building Bye-laws.
  replacement_text: '9.2 Exterior open spaces / setbacks, coverage, floor area ratio,
    numbers of floors and heights: Under Section 76M of the Karnataka Town and Country
    Planning Act, 1961 and Revised Master Plan 2015 Volume III Zoning Regulations
    (G.O. No. UDD 540 BEM AA SE 2004, effective 25-06-2007), the setbacks required
    on all sides of buildings up to 11.5 m height (plots up to 4000 sq.m) and high-rise
    buildings above 11.5 m height are governed by Chapter 3, Regulation 3.1 (Table
    8: Exterior open spaces / setbacks in percentage of width/depth of plot, and Table
    9: All-around setbacks for buildings above 11.5 m height) of the RMP 2015 Zoning
    Regulations, superseding Tables 4 and 5 of the 2003 Bye-laws.'
- amending_clause: rmp2015-zr:chp_3__cl_3.1
  target_clause: bbl-2003:part_III__sec_9.0__cl_9.3__cl_9.3.1
  action: substitute
  effective_date: '2007-06-25'
  confidence: high
  verification: machine_checked
  note: RMP 2015 Volume III Zoning Regulations Regulation 3.1 (Table 9, p. 24, effective
    25-06-2007) defines high-rise buildings as 11.5 m and above and prescribes progressive
    all-around setbacks (5.0 m to 16.0 m), superseding Clause 9.3.1 and Table 5 of
    the 2003 Building Bye-laws.
  replacement_text: '9.3.1 High-rise buildings (11.5 m height and above): In the case
    of high-rise buildings (11.5 m height and above), the minimum all-around front,
    rear, and side setbacks shall be as specified in Chapter 3, Regulation 3.1, Table
    9 of the Revised Master Plan 2015 Zoning Regulations (effective 25-06-2007), starting
    at 5.0 m all-around for buildings above 11.5 m up to 15.0 m height and increasing
    progressively up to 16.0 m for buildings above 50.0 m height.'
- amending_clause: rmp2015-zr:chp_1__cl_1.2
  target_clause: bbl-2003:part_III__sec_9.0__cl_9.10__cl_9.10.1
  action: substitute
  effective_date: '2007-06-25'
  confidence: high
  verification: machine_checked
  note: RMP 2015 Volume III Zoning Regulations Chapter 1, Clause 1.2 (p. 15) and Chapter
    4 (Tables 10–19) supersede the 1995 CDP A, B & C area classification and Table
    6 in Clause 9.10.1 of the 2003 Building Bye-laws.
  replacement_text: '9.10.1 Limitations of floor area and covered area: Under Revised
    Master Plan 2015 Volume III Zoning Regulations (effective 25-06-2007), the Local
    Planning Area of Bengaluru is organized into three main Rings (Ring I: Core Area
    within Core Ring Road; Ring II: Developed Area between Core Ring Road and Outer
    Ring Road; Ring III: Developing Area beyond Outer Ring Road) and zone-specific
    land-use categories in Chapter 4 (Tables 10–19), which govern maximum plot coverage
    and Floor Area Ratio (FAR) with reference to plot size and existing road width,
    superseding the 1995 CDP A, B and C areas and Table 6 of the 2003 Bye-laws.'
- amending_clause: rmp2015-zr:chp_8
  target_clause: bbl-2003:part_III__sec_16.0
  action: substitute
  effective_date: '2007-06-25'
  confidence: high
  verification: machine_checked
  note: RMP 2015 Volume III Zoning Regulations Chapter 8 (Table 23, pp. 46–49, effective
    25-06-2007) supersedes the parking space standards in Clause 16.0 and Table 13
    of the 2003 Building Bye-laws.
  replacement_text: '16.0 Parking space: Adequate space for the parking of vehicles
    shall be provided in the sites in accordance with the parking norms and stipulations
    set out in Chapter 8, Table 23 of the Revised Master Plan 2015 Volume III Zoning
    Regulations (effective 25-06-2007), superseding Table 13 of the 2003 Bye-laws.'
- amending_clause: rmp2015-zr:chp_9__cl_9.3
  target_clause: bbl-2003:part_IV__sec_30.0
  action: modify
  effective_date: '2007-06-25'
  confidence: high
  verification: machine_checked
  note: RMP 2015 Volume III Zoning Regulations Chapter 9, Clause 9.3 (p. 50, effective
    25-06-2007) reinforces earthquake-resistant structural design certification for
    buildings above 15.0 m height alongside Clause 30.0 of the 2003 Building Bye-laws.
  replacement_text: '30.0 SAFETY MEASURES AGAINST EARTHQUAKE IN BUILDING CONSTRUCTION:
    Buildings with ground plus three floors and above or height of 11.5 m / 15.0 m
    and above shall be designed and constructed in accordance with the Indian Standard
    codes for earthquake-resistant design (IS 1893, IS 13920, IS 4326) and certified
    by a Registered Structural Engineer under Clause 30.0 and Chapter 9, Clause 9.3
    of the RMP 2015 Zoning Regulations.'
- amending_clause: ka-model-bbl-2017:chp_2__item_2__item_3
  target_clause: bbl-2003:part_I__sec_1.0__cl_1.3
  action: insert_after
  effective_date: '2017-10-28'
  confidence: high
  verification: machine_checked
  note: Karnataka Municipal Corporations Model Building Bye-Laws, 2017 (Notification
    No. UDD 14 TTP 2017 (P-4), dated 28-10-2017, Clause 1(3), pp. 2 & 128) incorporates
    all mandatory Master Plan / Zonal Regulations and their amendments mutatis mutandis
    into the municipal building bye-laws.
  replacement_text: '1.4 Mutatis mutandis application of Master Plan and Zonal Regulations:
    Pursuant to Clause 1(3) of Notification No. UDD 14 TTP 2017 (P-4) dated 28-10-2017
    (published on the official GBA/BBMP Building Plan Approval System under Bye laws
    and Zoning Regulations), all mandatory Master Plan or Zonal Regulations regarding
    use, land use, coverage, FAR, setback or open space, height, number of stories,
    number of dwelling units, and parking standards for various categories of buildings,
    including all amendments or modifications made therein from time to time, apply
    mutatis mutandis as part of these Bye-laws.'
- amending_clause: ka-model-bbl-2017:chp_1
  target_clause: bbl-2003:part_II__sec_3.0
  action: modify
  effective_date: '2017-10-28'
  confidence: low
  verification: unverified
  note: Karnataka Municipal Corporations Model Building Bye-Laws, 2017 (Notification
    No. UDD 14 TTP 2017 (P-4), dated 28-10-2017) sets out a state model procedural
    framework; recorded with low confidence (not applied to in-force text) because
    Bangalore Mahanagara Palike Building Bye-laws 2003 remain listed as the operative
    principal municipal bye-laws on bpas.bbmpgov.in pending formal corporation-specific
    bye-law adoption.
- amending_clause: udd-1107-mnu-2018-draft:cl_4
