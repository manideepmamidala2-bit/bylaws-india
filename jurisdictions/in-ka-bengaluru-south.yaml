  target_clause: bbl-2003:part_II__sec_6.0__item_i
  action: substitute
  effective_date: '2026-05-14'
  confidence: high
  verification: machine_checked
  applies_in:
  - in-ka-bengaluru-south
  replacement_text: Wherever any construction is in violation/deviation of the sanctioned
    plan, the Commissioner may, if he considers that the violations / deviations are
    within the limits specified in Table-2B below in case of (1) the setback to be
    provided around the building, (2) plot coverage (3) floor area ratio and (4) height
    of the building and that the demolition under chapter XVII of the Act is not feasible
    without affecting structural stability, he may regularize such violations/deviations
    after recording detailed reasons for the same and levying compounding fee as per
    Table-2A, Table-2C and Table-2D
  note: 'Substituted by Clause 3 of No: BSCC/Com/PR/35/2026-27 (Bengaluru South City
    Corporation, effective 14-05-2026), which also inserts Table-2A (occupancy certificate
    fee), Table-2B (maximum condonable deviation limits: up to 15% setback and coverage;
    up to 15% FAR on plots up to 500 m² and 5% FAR above 500 m²; 7.5% height not beyond
    sanctioned floors), Table-2C, and Table-2D.'
