- amending_clause: rmp2015-zr-amend-2025-02:chp_11
  target_clause: rmp2015-zr:chp_10
  action: insert_after
  effective_date: '2025-02-21'
  confidence: high
  verification: unverified
  note: Draft Notification No. UDD 78 MNJ 2024 (E) dated 21-02-2025 proposing insertion
    of Chapter 11 (Premium FAR); not applied from this draft because it has legal_status
    "draft" and was superseded by the final Gazette Notification dated 02-04-2025
    (rmp2015-zr-amend-2025-04).
- amending_clause: rmp2015-zr-amend-2025-04:chp_11_2
  target_clause: rmp2015-zr:chp_10
  action: insert_after
  effective_date: '2025-04-02'
  confidence: high
  verification: machine_checked
  replacement_text: '11.0 CHAPTER 11 — PREMIUM F.A.R GRANTED BY LEVY OF PREMIUM CHARGES
    (Inserted after Chapter 10 by Notification No. UDD 78 MNJ 2024 (E), dated 02-04-2025):
    (1) Additional Premium FAR over and above the permissible FAR in the Zonal Regulations
    is permissible based on abutting road width: (a) Road width above 9 meters and
    up to 12 meters: up to 20% of permissible FAR (0.2 factor); (b) Road width above
    12 meters and up to 18 meters: up to 40% of permissible FAR (0.4 factor); (c)
    Road width above 18 meters: up to 60% of permissible FAR (0.6 factor). (2) The
    maximum combined additional FAR (Premium FAR + TDR/DRC) shall not exceed 60% of
    regular permissible FAR. (3) Premium FAR charges shall be 50% of the Guidance
    Value (under Section 45B of the Karnataka Stamp Act, 1957) of the notional land
    required for the additional floor area (i.e. Additional Built-up Area divided
    by permissible FAR), or 28% of the combined land + building guidance value per
    sq.m, whichever is higher.'
  note: Final Notification No. UDD 78 MNJ 2024 (E) dated 02-04-2025 inserts Chapter
    11 (Premium F.A.R Granted by Levy of Premium Charges) after Chapter 10 of RMP
    2015 Zonal Regulations.
- amending_clause: rmp2015-zr-amend-2025-10:part_IVA__tbl_1
  target_clause: rmp2015-zr:chp_4__cl_4.12__cl_4.12.2
  action: substitute
  effective_date: '2025-10-15'
  confidence: high
  verification: machine_checked
  replacement_text: '4.12.2 Regulations for Park and Open Space (P) & Valley / Drain
    Buffer Zones (amended 15-10-2025 by Notification No. UDD 468 MNJ 2025(E)): In
    case of water bodies, a 30.0 m buffer of "No Development Zone" is to be maintained
    around the lake as per revenue records. Valley / Storm Water Drain (Nala) Buffer
    Table: (1) Primary / Raja Kaluve (P-1): 15m buffer from the edge of the drain;
    (2) Secondary drain (P-2): 10m buffer from the edge of the drain; (3) Tertiary
    drain (P-3): 5m buffer from the edge of the drain. Drains/nalas leading to tertiary
    drains shall be maintained as per revenue records and no buffer shall be insisted
    for such drains.'
  note: Notification No. UDD 468 MNJ 2025(E) dated 15-10-2025 substitutes the storm
    water drain / nala buffer table under Regulation 4.12.2 (Primary 15m, Secondary
    10m, Tertiary 5m).
- amending_clause: rmp2015-zr-amend-2026-01:cl_11.11.2025__item_a
  target_clause: rmp2015-zr:chp_3__cl_3.1
  action: substitute
  effective_date: '2026-01-05'
  confidence: high
  verification: machine_checked
  replacement_text: '3.1 SETBACKS (substituted 05-01-2026 by Notification No. UDD
    235 MNJ 2025(E)): Clauses (ii) & (iii) and Table 8 (Setbacks for buildings with
    total height up to 12.0 m excluding stilt floor): (1) Plot up to 60 sq.m (All
    uses): Front 0.75 m, Rear 0 m, Left 0 m, Right 0.75 m; (2) Plot above 60 sq.m
    up to 150 sq.m (Width up to 9.0 m): Front 0.90 m, Rear 0.75 m, Left 0.75 m, Right
    0.90 m; (Width above 9.0 m): Front 12% of depth (min 1.0 m), Rear 8% (min 0.75
    m), Left 8% (min 0.75 m), Right 8% (min 1.0 m); (3) Plot above 150 sq.m up to
    250 sq.m: Front 1.00 m (or 12%), Rear 0.80 m (or 8%), Left 0.80 m (or 8%), Right
    1.00 m (or 8%); (4) Plot above 250 sq.m up to 4000 sq.m: Front 12% of depth, Rear
    8% of depth, Left 8% of width, Right 8% of width; (5) Plot above 4000 sq.m: minimum
    setback of 5.0 m on all sides. Note 1: For plots up to 250 sq.m in area, maximum
    permissible building height is 15.0 m (including stilt floor) and setbacks in
    Table 8 apply.'
  note: Notification No. UDD 235 MNJ 2025(E) dated 05-01-2026 substitutes Regulation
    3.1 Clauses (ii)–(iii), Table 8 (Setbacks up to 12m/15m height), and inserts Notes
    1–7 after Table 9.
