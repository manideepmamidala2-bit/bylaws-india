not_modelled:
  - Full copyrighted text of the National Building Code of India 2016 (BIS SP 7:2016) — recorded as reference_only citations per Rule R13
  - Airport obstacle limitation surfaces and Colour Coded Zoning Map (CCZM) height polygons — accessed via AAI NOCAS portal per Rule R13
  - Structural engineering load calculations (IS 456, IS 1893 seismic zones) and electrical/HVAC installation codes
  - Lake buffer polygons under the 2025 KTCDA Amendment Bill due to contested assent/notification status (declared status_unknown per Plan v2.0 §5.C4)
  - Storm water drain (Rajakaluve) primary/secondary/tertiary buffer polygons pending official classified drain centreline GIS publication from GBA
unread_documents:
  - title: Administrative Circular on BPAS Online Fee Challan Reconciliation (2024)
    source_url: https://bpas.bbmpgov.in/BPAMSClient4/CommonForms/Circulars.aspx
    reason: Purely internal accounting procedure; does not alter building parameters or development controls (Plan v2.0 §3.6)
unobtainable_documents:
