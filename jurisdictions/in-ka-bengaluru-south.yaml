    title: Original 2019 Gazette Scan for Transport & Telecommunication (T&T) Zone Uses Amendment
    searched_sources:
      - https://gazette.kar.nic.in
      - https://bpas.bbmpgov.in/BPAMSClient4/CommonForms/Circulars.aspx
      - https://site.bbmp.gov.in/townplanning.html
      - https://data.opencity.in/organization/bangalore-development-authority
    reason: BPAS circulars portal link returns HTTP 404; structured from the verified BPAS/BDA consolidated circular text on T&T permissible uses
contested_status:
  - doc_id: ktcda-act
    title: Karnataka Tank Conservation and Development Authority (Amendment) Bill / Act, 2025 (Size-Based Lake Buffers)
    declared_status: status_unknown
    conflicting_evidence:
      - "Passed by Karnataka Legislative Assembly and Legislative Council in August 2025 proposing tiered lake buffers (0 m for <0.05 ha, 3 m for 0.05-0.4 ha, 6 m for 0.4-2 ha, 12 m for 2-10 ha, 24 m for 10-40 ha, 30 m for >40 ha)."
      - "Conflicting public reports on Governor assent and final Part IV-A Karnataka Gazette notification date alongside pending NGT/High Court challenges to buffer reductions vs NGT 30 m / 75 m norms; declared status_unknown per Plan v2.0 §3.5 and §5.C4."
