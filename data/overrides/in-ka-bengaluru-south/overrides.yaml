zone_tags:
  # Universal provisions (ALL zones)
  - clause_id: bbl-2003:1.1
    zones:
      - ALL
    reason: "These Bye-laws shall be called the Bengaluru City Corporation Building Bye-laws 2003 and apply to all building sites within the jurisdiction of the Corporation"
    verification: machine_checked
  - clause_id: bbl-2003:3.1
    zones:
      - ALL
    reason: "No person shall erect, re-erect or make material alterations to any building without obtaining a sanctioned building plan and licence from the Commissioner"
    verification: machine_checked
  - clause_id: bbl-2003:3.2
    zones:
      - ALL
    reason: "Every application for a high-rise or special building shall be accompanied by clearances from BWSSB, BESCOM, Karnataka Fire and Emergency Services, and Airports Authority of India"
    verification: machine_checked
  - clause_id: bbl-2003:3.6
    zones:
      - ALL
    reason: "After plinth-level construction is completed in accordance with the sanctioned plan, the owner shall obtain a Commencement Certificate"
    verification: machine_checked
  - clause_id: bbl-2003:5.6
    zones:
      - ALL
    reason: "Every building upon completion shall obtain an Occupancy Certificate certifying compliance with the sanctioned building plan"
    verification: machine_checked
  - clause_id: bbl-2003:6.0
    zones:
      - ALL
      - R-Main
      - R-Mixed
      - C-Central
      - C-Business
      - C-Mutation
    reason: "Minor construction deviations not exceeding 5 percent in setbacks, building height, or covered area may be compounded subject to Table 2B"
    verification: machine_checked
  - clause_id: bscc-bbl-amend-2026:3.1
    zones:
      - ALL
      - R-Main
      - R-Mixed
      - C-Central
      - C-Business
      - C-Mutation
    reason: "Dimensional deviations in setbacks, ground coverage, and building height up to the limits specified in revised Table 2B (up to 10 percent for residential plots up to 240 sq.m and up to 5 percent for larger plots)"
    verification: machine_checked
  - clause_id: bbl-2003:11.1
    zones:
      - ALL
      - R-Main
      - R-Mixed
    reason: "Habitable rooms, kitchens, bathrooms, and ventilation shafts shall conform to Table 4 and Part 3 of the National Building Code"
    verification: machine_checked
  - clause_id: bbl-2003:14.2
    zones:
      - ALL
    reason: "Every multi-dwelling or commercial building shall provide minimum staircase width of 1.25 m (1.50 m for assembly/institutional buildings)"
    verification: machine_checked
  - clause_id: bbl-2003:18.1
    zones:
      - ALL
    reason: "High-rise buildings of 21 metres and above shall provide minimum 6.0 m all-round fire tender driveway, wet risers, automatic sprinklers, and refuge areas per Part 4 of NBC 2016"
    verification: machine_checked
  - clause_id: bbl-2003:19.1
    zones:
      - ALL
    reason: "Every building plan shall carry a Structural Design Basis Report and certificate in Schedule V signed by a registered Structural Engineer for seismic Zone II compliance"
    verification: machine_checked
  - clause_id: bbl-2003:22.1
    zones:
      - ALL
    reason: "Every building exceeding 15 metres in height (or Ground plus 3 floors) shall be provided with at least one passenger lift and one stretcher/fire lift"
    verification: machine_checked
  - clause_id: bbl-2003:32.1
    zones:
      - ALL
    reason: "Every building on a sital area of 108 sq.m (1,200 sq.ft) or more shall install rooftop rainwater harvesting storage/recharge pits and dual piping"
    verification: machine_checked
  - clause_id: rmp2015-zr:1.1
    zones:
      - ALL
    reason: "These Zoning Regulations of the Revised Master Plan 2015 apply to the entire Local Planning Area of Bengaluru"
    verification: machine_checked
  - clause_id: rmp2015-zr:3.10
    zones:
      - ALL
      - R-Main
      - R-Mixed
      - C-Central
      - C-Business
      - C-Mutation
      - I-General
      - I-HiTech
      - P&SP
    reason: "Minimum front, rear, and side setbacks for all buildings up to 11.5 metres in height shall be governed by plot width and depth as specified in Table 8"
    verification: machine_checked
  - clause_id: rmp2015-zr:3.12
    zones:
      - ALL
      - R-Main
      - R-Mixed
      - C-Central
      - C-Business
      - C-Mutation
      - I-HiTech
    reason: "Building height shall be measured from the average level of the centre line of the abutting street to the top of the terrace slab"
    verification: machine_checked
  - clause_id: rmp2015-zr-amend-2025-07:2.1
    zones:
      - ALL
      - R-Main
      - R-Mixed
      - C-Central
      - C-Business
      - C-Mutation
    reason: "One or two stilt floors used exclusively for vehicle parking up to a cumulative height of 4.5 metres shall be exempt from FAR computation"
    verification: machine_checked
  - clause_id: rmp2015-zr-amend-2026-01:2.1
    zones:
      - ALL
      - R-Main
      - R-Mixed
      - C-Central
      - C-Business
      - C-Mutation
    reason: "Minimum front, rear, and side setbacks for residential and commercial plots up to 4,000 sq.m shall be governed by revised Table 8 effective 5 January 2026"
    verification: machine_checked
  - clause_id: rmp2015-zr:8.1
    zones:
      - ALL
      - R-Main
      - R-Mixed
      - C-Central
      - C-Business
      - C-Mutation
      - I-General
      - I-HiTech
      - P&SP
      - T&T
    reason: "Every building shall provide off-street car and two-wheeler parking spaces within the plot (in stilt, basement, or surface bays) in accordance with Table 23"
    verification: machine_checked
  - clause_id: rmp2015-zr-amend-2026-01:3.1
    zones:
      - ALL
      - R-Main
      - R-Mixed
      - C-Central
      - C-Business
      - C-Mutation
      - I-HiTech
    reason: "Every building shall provide off-street parking per Table 23, with mandatory electric vehicle (EV) charging points for at least 20 percent of car and two-wheeler parking bays"
    verification: machine_checked
  - clause_id: rmp2015-zr:10.1
    zones:
      - ALL
      - R-Main
      - R-Mixed
      - C-Central
      - C-Business
      - C-Mutation
      - I-General
      - I-HiTech
    reason: "Additional FAR up to 0.50 over base FAR may be loaded through TDR or Premium FAR on plots abutting roads of minimum 12.0 metres width"
    verification: machine_checked
  - clause_id: rmp2015-zr-premium-far-2025-02:2.1
    zones:
      - ALL
      - R-Main
      - R-Mixed
      - C-Central
      - C-Business
      - C-Mutation
      - I-General
      - I-HiTech
    reason: "After regulation 10.1, insert the following new Chapter 11 granting purchasable Premium FAR up to 0.60 over the base FAR on plots abutting roads of 9.0 metres width and above"
    verification: machine_checked
  - clause_id: rmp2015-zr-premium-far-2026-02:2.1
    zones:
      - ALL
      - R-Main
      - R-Mixed
      - C-Central
      - C-Business
      - C-Mutation
      - I-General
      - I-HiTech
    reason: "Plots abutting roads of 9.0 m to 12.0 m may load up to 0.20 Premium FAR; roads above 12.0 m to 18.0 m up to 0.40; and roads above 18.0 m up to 0.60 over the permissible base FAR"
    verification: machine_checked

  # Zone-specific provisions
  - clause_id: rmp2015-zr:4.1
    zones:
      - R-Main
    reason: "R-Main covers established residential neighbourhoods including Basavanagudi, Jayanagar, JP Nagar, and Banashankari. Permissible uses are dwellings, apartments, parks, and neighbourhood civic amenities"
    verification: machine_checked
  - clause_id: rmp2015-zr:4.1.2
    zones:
      - R-Main
    reason: "Ancillary professional offices or neighbourhood retail up to 20 percent of built-up area or 50 sq.m (whichever is less) are permissible on roads of 12.0 m width and above in R-Main"
    verification: machine_checked
  - clause_id: rmp2015-zr-amend-2014:2.1
    zones:
      - R-Main
    reason: "Ancillary commercial uses in Residential (Main) zone are permissible only in Ring I and Ring II on plots up to 240 sq.m abutting roads of 12.0 m width or more"
    verification: machine_checked
  - clause_id: rmp2015-zr:4.2
    zones:
      - R-Mixed
    reason: "R-Mixed permits residential development alongside commercial and institutional uses subject to abutting road width thresholds under Table 10"
    verification: machine_checked
  - clause_id: rmp2015-zr-amend-2018:2.1
    zones:
      - R-Mixed
    reason: "in Residential (Mixed) zone [R-Mixed], standalone commercial buildings are permitted only where the abutting street has an existing clear width of 12.0 metres or more"
    verification: machine_checked
  - clause_id: rmp2015-zr:4.3
    zones:
      - C-Central
    reason: "C-Central covers high-intensity commercial cores in Ring I and Ring II with FAR from 2.50 to 3.00 and maximum ground coverage up to 75 percent"
    verification: machine_checked
  - clause_id: rmp2015-zr:4.4
    zones:
      - C-Business
    reason: "C-Business covers district commercial centres and sub-arterial commercial corridors in Ring II and Ring III with FAR from 1.75 to 3.25 based on road width"
    verification: machine_checked
  - clause_id: rmp2015-zr:4.5
    zones:
      - C-Mutation
    reason: "C-Mutation applies to plots abutting designated arterial and radial corridors up to a depth of 50 metres, permitting commercial and mixed-use development up to FAR 2.75 to 3.25"
    verification: machine_checked
  - clause_id: rmp2015-zr:4.6
    zones:
      - I-General
    reason: "I-General permits light, medium, and service industries, warehousing, and logistics with ground coverage from 45 percent to 60 percent and FAR from 1.00 to 1.50"
    verification: machine_checked
  - clause_id: rmp2015-zr:4.7
    zones:
      - I-HiTech
    reason: "I-HiTech covers IT/BT corridors, electronics parks, R&D campuses, and support commercial/residential uses in Electronics City, Bommanahalli, and Bannerghatta corridors with FAR up to 3.25"
    verification: machine_checked
  - clause_id: rmp2015-zr:4.8
    zones:
      - P&SP
    reason: "P&SP covers government offices, educational institutions, hospitals, cultural centres, and civic utilities with ground coverage up to 45 percent and FAR from 1.50 to 2.50"
    verification: machine_checked
  - clause_id: rmp2015-zr:4.9
    zones:
      - T&T
    reason: "T&T covers bus terminals, metro stations and depots, railway yards, and multi-modal transit facilities with FAR up to 1.50"
    verification: machine_checked
  - clause_id: rmp2015-zr-amend-tt:2.1
    zones:
      - T&T
    reason: "T&T zone permits bus terminals, metro stations, depots, multi-level parking, telecommunication towers, and ancillary commercial/office transit-oriented development up to 25 percent of total built-up area with FAR up to 2.25"
    verification: machine_checked
  - clause_id: rmp2015-zr:4.10
    zones:
      - Park
    reason: "Park and Open Space zone permits only public parks, playgrounds, botanical gardens, and sports fields; ancillary sports/watchman structures shall not exceed 5 percent of site area at Ground plus 1 floor"
    verification: machine_checked
  - clause_id: rmp2015-zr:6.1
    zones:
      - R-Main
      - R-Mixed
    reason: "Every residential layout exceeding 4,000 sq.m shall earmark at least 15 percent of total area for parks and open spaces and 10 percent for civic amenities"
    verification: machine_checked

  # Enabling Acts, Orders & Overlays
  - clause_id: gbg-act-2024:240
    zones:
      - ALL
    reason: "Every City Corporation within the Greater Bengaluru Area shall enforce the municipal building bye-laws and master plan zoning regulations in force within its territorial jurisdiction"
    verification: machine_checked
  - clause_id: gbg-act-2024:248
    zones:
      - R-Main
      - R-Mixed
    reason: "The State Government may by order exempt low-rise residential buildings on plots up to 2,400 sq.ft (up to Ground plus 3 floors) constructed in accordance with sanctioned plans from obtaining a separate Occupancy Certificate"
    verification: machine_checked
  - clause_id: ktcp-act-1961:14
    zones:
      - ALL
    reason: "every land use and every building development within the Planning Area shall conform to the Zonal Regulations"
    verification: machine_checked
  - clause_id: ktcp-act-1961:18-B
    zones:
      - ALL
      - R-Main
      - R-Mixed
      - C-Central
      - C-Business
      - C-Mutation
      - I-General
      - I-HiTech
    reason: "The Planning Authority or City Corporation may grant additional Floor Area Ratio (Premium FAR) on payment of such fee not exceeding 50 percent of the market/guidance value"
    verification: machine_checked
  - clause_id: tdr-rules-2016:7.1
    zones:
      - ALL
      - R-Main
      - R-Mixed
      - C-Central
      - C-Business
      - C-Mutation
      - I-General
      - I-HiTech
    reason: "TDR may be utilised to increase permissible FAR up to the road-width caps specified in Chapter 10 and Chapter 11 of the RMP 2015 Zoning Regulations"
    verification: machine_checked
  - clause_id: kfs-act-1964:13
    zones:
      - ALL
    reason: "every high-rise building of 21 metres or more in height shall obtain a Fire Prevention and Fire Safety No Objection Certificate (NOC)"
    verification: machine_checked
  - clause_id: metro-influence-2020:1.1
    zones:
      - overlay-metro-11m
    reason: "a corridor of 11 metres on either side of the outer edge of Namma Metro underground twin-bored tunnels and underground station boxes is declared as the Metro Influence Zone"
    verification: machine_checked
  - clause_id: metro-influence-2020:1.2
    zones:
      - overlay-metro-11m
    reason: "No excavation, piling, basement construction, or borewell drilling on any plot falling wholly or partly within the 11 metre Underground Metro Influence Zone in Bengaluru South shall be sanctioned without a structural No Objection Certificate from Bangalore Metro Rail Corporation Limited (BMRCL)"
    verification: machine_checked
  - clause_id: oc-exemption-2026-06:1.1
    zones:
      - R-Main
      - R-Mixed
    reason: "standalone residential buildings on plots up to 2,400 sq.ft (223 sq.m, with up to +20 percent sital area tolerance for odd-dimensional plots) and height up to Ground plus 3 floors or Stilt plus 3 floors within Bengaluru South City Corporation are exempt from obtaining a separate Occupancy Certificate"
    verification: machine_checked
  - clause_id: gba-oc-cc-rules-2025:1.1
    zones:
      - ALL
    reason: "Every builder/owner on plots exceeding 240 sq.m shall apply online for a Commencement Certificate upon completing foundation and plinth beams"
    verification: machine_checked
  - clause_id: bbmp-noc-details:1.1
    zones:
      - R-Main
      - R-Mixed
    reason: "Residential plots up to 50 ft x 80 ft (4,000 sq.ft / 371.6 sq.m) within Bengaluru South City Corporation are eligible for instant provisional building plan approval uploaded by an empaneled Architect/Engineer"
    verification: machine_checked
  - clause_id: bbmp-noc-details:1.6
    zones:
      - ALL
    reason: "Departmental No Objection Certificates are required strictly according to Table 1.1 based on building height, built-up area, and location"
    verification: machine_checked
  - clause_id: rmp2015-zr-highrise-24m-draft:D1.1
    zones:
      - ALL
    reason: "Draft Notification No. UDD 165 MNJ 2025 dated 20 August 2025 proposes to raise the high-rise threshold in the RMP 2015 Zonal Regulations from 21 metres to 24 metres"
    verification: machine_checked
