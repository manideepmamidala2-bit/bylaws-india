name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pipeline:
    name: Python Pipeline (codegen + R4 licences + provenance gate + ruff + pytest + Docling)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks secret scan over full git history
        working-directory: .
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          gitleaks git -v .

      - name: Install system packages (Tesseract OCR & GDAL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng gdal-bin libgdal-dev

      - name: Set up Node.js (for TypeScript codegen verification)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install npm dependencies
        working-directory: .
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pipeline/uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Cache Docling & Hugging Face models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/docling
          key: docling-models-${{ runner.os }}-${{ hashFiles('pipeline/uv.lock') }}
          restore-keys: |
            docling-models-${{ runner.os }}-

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Verify single-source codegen freshness
        working-directory: .
        run: |
          (cd pipeline && uv run python ../scripts/generate_models.py --check)
          git diff --exit-code pipeline/bylaws/models/_generated.py lib/types/generated.ts

      - name: Run Ruff lint check
        run: uv run ruff check .

      - name: Run R15/R16 Provenance Gate
        run: uv run bylaws check-provenance

      - name: Run Rule R4 permissive licence & dependencies check
        run: uv run pytest tests/test_r4_licences.py -v

      - name: Run fixture end-to-end vertical slice and Docling parser
        run: |
          uv run bylaws run-all --jurisdiction xx-test-fixture
          uv run bylaws parse --jurisdiction xx-test-fixture --parser docling

      - name: Pull published dataset & PMTiles from storage and build search index
        working-directory: .
        run: |
          node scripts/ensure_data.mjs
          node scripts/build_place_index.mjs
          node scripts/build_machine_readable.mjs
          node scripts/build_search.mjs

      - name: Run full pytest suite (schemas, CLI, R1, R4, provenance, golden snapshots)
        run: uv run pytest -v

  web:
    name: Next.js Web App (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Pull published dataset & PMTiles from storage and build search index
        run: |
          node scripts/ensure_data.mjs
          node scripts/build_place_index.mjs
          node scripts/build_machine_readable.mjs
          node scripts/build_search.mjs

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run Vitest unit/smoke tests
        run: npm test

      - name: Build production Next.js bundle
        run: npm run build

      - name: Enforce page weight budgets (HTML <= 300 KB, initial JS+data <= 1.5 MB)
        run: npm run check-budgets

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright browser tests (PMTiles 206 range, non-blank map, document page, plot flow)
        run: npx playwright test
