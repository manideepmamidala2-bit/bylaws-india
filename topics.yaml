schema_version: "1.4"
topics:
  - id: land_use
    label: "Land Use & Permissible Uses"
    description: "Main and ancillary land uses permitted or prohibited in Residential, Commercial, Industrial, Public/Semi-Public, Traffic & Transportation, and Green zones across Rings I, II, and III."
    seed_phrases:
      - "permissible land use"
      - "permissible uses"
      - "ancillary land use"
      - "ancillary uses"
      - "residential (main)"
      - "residential (mixed)"
      - "commercial (central)"
      - "commercial (business)"
      - "mutation corridors"
      - "commercial axes"
      - "industrial"
      - "public and semi-public"
      - "traffic and transportation"
      - "park and open space"
  - id: far
    label: "Floor Area Ratio (FAR), Premium FAR & TDR"
    description: "Permissible Floor Area Ratio (FAR), exclusions from FAR computation, Impact Zone / Metro Premium FAR, Premium FAR by road width, and Transfer of Development Rights (TDR / DRC)."
    seed_phrases:
      - "floor area ratio"
      - "f.a.r"
      - "premium far"
      - "premium f.a.R"
      - "transfer of development rights"
      - "development rights certificate"
      - "tdr"
      - "d.r.c"
      - "additional far"
  - id: ground_coverage
    label: "Ground Coverage"
    description: "Maximum permissible plot ground coverage percentage by zone, plot size, and building type."
    seed_phrases:
      - "ground coverage"
      - "plot coverage"
      - "covered area"
      - "maximum plot coverage"
      - "coverage"
  - id: setbacks
    label: "Setbacks & Building Lines"
    description: "Front, rear, left, and right minimum setbacks by plot size or building height, distance between buildings, and building lines along arterial roads."
    seed_phrases:
      - "setback"
      - "setbacks"
      - "set back"
      - "front setback"
      - "rear setback"
      - "side setback"
      - "building line"
      - "distance between buildings"
      - "table 8"
      - "table 9"
      - "table 4"
  - id: building_height
    label: "Building Height & High-Rise Norms"
    description: "Maximum permissible building height, high-rise building threshold (15 m and above), aviation/HAL/AAI NOC height limits, and number of floors."
    seed_phrases:
      - "height of building"
      - "height of the building"
      - "building height"
      - "high rise building"
      - "high-rise building"
      - "total height"
      - "15 m"
      - "12.0 m"
      - "aerodrome"
  - id: parking
    label: "Parking & Ramps"
    description: "Minimum off-street car and two-wheeler parking requirements by building use, visitor parking, mechanical/multi-level parking, and ramp width/slope rules."
    seed_phrases:
      - "parking"
      - "parking space"
      - "parking requirements"
      - "visitor parking"
      - "multi-level parking"
      - "mechanical car lift"
      - "ramp"
      - "ramps"
      - "table 23"
      - "table 13"
  - id: basements_stilts
    label: "Basements, Cellars & Stilt Floors"
    description: "Permissibility, number, setback, height, and permitted uses of basement/cellar floors and stilt parking floors."
    seed_phrases:
      - "basement"
      - "cellar"
      - "stilt floor"
      - "stilt"
      - "semi-basement"
      - "lower ground floor"
  - id: projections_open_spaces
    label: "Projections, Balconies, Open Spaces & Buffers"
    description: "Chajjas, balconies, canopies, open staircases in setbacks, compound walls, courtyards, and lake/valley/storm-water-drain (nala) buffer zones."
    seed_phrases:
      - "balcony"
      - "chajja"
      - "canopy"
      - "projection"
      - "compound wall"
      - "courtyard"
      - "open space"
      - "buffer"
      - "nala"
      - "drain"
      - "water bodies"
  - id: plot_size_frontage
    label: "Plot Size, Frontage & Subdivision"
    description: "Minimum plot area and frontage for apartments, commercial uses, and subdivisions/development plans."
    seed_phrases:
      - "plot size"
      - "plot area"
      - "sital area"
      - "site area"
      - "frontage"
      - "sub-division"
      - "subdivision"
      - "development plan"
      - "amalgamation"
      - "bifurcation"
  - id: road_width
    label: "Road Width & Means of Access"
    description: "Measurement of road width, minimum road width for apartments, high-rise buildings, and commercial uses, cul-de-sacs, and splay at road intersections."
    seed_phrases:
      - "width of the road"
      - "road width"
      - "means of access"
      - "cul-de-sac"
      - "splay"
      - "road widening"
  - id: deviations_regularisation
    label: "Deviations, Compounding & Penalties"
    description: "Condonable limits of construction deviation in setback, coverage, FAR, and height (Table-2B) and compounding fees (Table-2A, Table-2C, Table-2D)."
    seed_phrases:
      - "deviation"
      - "deviations"
      - "violation"
      - "compounding fee"
      - "condonable"
      - "regularize"
      - "regularisation"
      - "table-2b"
      - "table-2c"
      - "table-2d"
      - "penalty"
  - id: approvals_certificates
    label: "Plan Sanction, Plinth & Occupancy Certificates"
    description: "Building licence application, scrutiny fee, ground rent, commencement/plinth certificate, completion report, and Occupancy Certificate (OC)."
    seed_phrases:
      - "building licence"
      - "sanctioned plan"
      - "plan sanction"
      - "commencement certificate"
      - "plinth certificate"
      - "occupancy certificate"
      - "completion certificate"
      - "ground rent"
      - "scrutiny fee"
      - "security deposit"
  - id: fire_safety
    label: "Fire Protection, Exit Requirements & Structural Safety"
    description: "Fire protection norms, Fire Force NOC for high-rise buildings, fire driveway, refuge area, staircases/exits, rainwater harvesting, and solar requirements."
    seed_phrases:
      - "fire protection"
      - "fire safety"
      - "fire drive way"
      - "fire control room"
      - "refuge area"
      - "no objection certificate"
      - "staircase"
      - "exit"
      - "rain water harvesting"
      - "solar"
  - id: definitions
    label: "Definitions of Building & Planning Terms"
    description: "Statutory definitions of technical, architectural, and planning terms across the Building Bye-laws and Master Plan Zoning Regulations."
    seed_phrases:
      - "definitions"
      - "technical terms and definitions"
      - "means"
